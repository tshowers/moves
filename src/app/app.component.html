@if (!isFlowRoute() && !hasOwnHeader()) {
  <mv-site-header [landing]="isLanding()" />
}
@if (hasOwnHeader()) {
  <div class="app-global-actions"><app-platform-menu [isAdmin]="(isAdmin$ | async) ?? false" [isLoggedIn]="(isLoggedIn$ | async) ?? false" [userName]="(userName$ | async) ?? ''" [userEmail]="(userEmail$ | async) ?? ''" (signOut)="signOut()" /></div>
}
<router-outlet></router-outlet>
<app-moves-assistant-launcher></app-moves-assistant-launcher>
<app-toast></app-toast>
<app-write-access-prompt />
@if (updateNotice) {
  <div class="moves-update-notice" role="status" aria-live="polite">
    <span>{{ updateNotice }}</span>
    <button *ngIf="chunkRecoveryNeedsManualRefresh" type="button" (click)="refreshAfterChunkError()">Refresh</button>
    <button *ngIf="!chunkRecoveryNeedsManualRefresh" type="button" aria-label="Dismiss update notification" (click)="dismissUpdateNotice()">×</button>
  </div>
}
